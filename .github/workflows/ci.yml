name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install a virtual display (Xvfb)
        # Without a display every Tk window test skips silently, so the GUI was
        # never actually exercised in CI. Xvfb gives the runner a display.
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with mypy
        run: mypy

      - name: Run tests
        run: xvfb-run -a python -m pytest -q

      - name: Evaluate against baseline (regression gate)
        run: python -m evaluation

      - name: Train the ML pipeline (smoke check)
        run: python -m ml --episodes 60 --json > /dev/null

  package:
    name: Build and install the package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . -w dist --no-deps

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/pkg
          /tmp/pkg/bin/python -m pip install --upgrade pip
          /tmp/pkg/bin/python -m pip install dist/*.whl

      - name: Smoke-test the console script
        run: |
          /tmp/pkg/bin/fayd-al-ruh --help
          /tmp/pkg/bin/fayd-al-ruh paths

  portable:
    name: Portable bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and the build tool
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build the portable bundle
        run: python scripts/build.py --clean

      - name: Smoke-test the frozen bundle
        shell: bash
        run: |
          set -eu
          if [ -f dist/fayd-al-ruh/fayd-al-ruh.exe ]; then
            BIN=dist/fayd-al-ruh/fayd-al-ruh.exe
          else
            BIN=dist/fayd-al-ruh/fayd-al-ruh
          fi
          "$BIN" paths
          "$BIN" demo
          "$BIN" selfcheck

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: fayd-al-ruh-${{ matrix.os }}
          path: dist/fayd-al-ruh

  release:
    name: Attach bundles to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each bundle
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done

      - name: Publish bundles on the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --notes "Portable bundles for $tag."
          gh release upload "$tag" artifacts/*.zip --clobber

