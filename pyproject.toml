[build-system]
# The backend is setuptools, so setuptools must be declared here -- with an
# empty list pip's isolated build cannot import `setuptools.build_meta` at all
# and every `pip install .` / `pip wheel .` fails with BackendUnavailable.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fayd-al-ruh"
version = "2.3.0"
description = "An evidence-aware symbolic cognitive architecture."
requires-python = ">=3.12"
# The two libraries the base install genuinely needs at runtime: numpy backs the
# learning layers and requests backs the governed web source. Everything else is
# an optional extra below.
dependencies = [
    "numpy>=2.0",
    "requests>=2.31",
]

[project.scripts]
# `pip install .` gives the same entry point as `python -m cli`.
fayd-al-ruh = "cli.__main__:main"

[tool.setuptools.packages.find]
# The project is a set of top-level packages beside the checkout root, so
# discovery is scoped explicitly: without this, setuptools' flat-layout guessing
# either refuses the build ("multiple top-level packages") or sweeps in the
# tests. `scripts/` has no __init__.py and `main.py` is a demo module.
include = ["ai*", "cli*", "companion*", "core*", "evaluation*", "gui*", "hakeem*", "ingest*", "ml*", "storage*"]
exclude = ["tests*", "data*", "docs*", "knowledge*"]

[tool.setuptools]
py-modules = ["main"]

[project.optional-dependencies]
# PDF ingestion is optional: the reader imports pypdf lazily and reports a clear
# message when it is absent, so the base install stays dependency-light.
pdf = ["pypdf>=4.0"]
# OCR for scanned PDFs is a separate optional extra. It rasterises pages in
# memory (pypdfium2, no external poppler binary) and reads them with Tesseract
# through pytesseract. The Tesseract engine itself must be installed separately
# (e.g. `apt install tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara`); this
# extra is never required by the base install. ``pypdf`` is included because OCR
# runs on top of native page extraction.
ocr = ["pypdf>=4.0", "pypdfium2>=4.0", "pytesseract>=0.3.10", "Pillow>=10.0"]
# A *learned* text-to-image backend is a separate optional extra. The default
# renderer is dependency-free (`core/imagegen.py`); this extra adds a real
# diffusion model (Diffusers + a CPU torch) that can be dropped in behind the
# same `ImageGenerator` protocol. It is never required by the base install, the
# import is lazy, and the model weights (~2.5 GB) download only after an
# explicit, human-approved request (see `core/imagegen_diffusion.py`).
image = [
    "torch>=2.2",
    "diffusers>=0.27",
    "transformers>=4.40",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "Pillow>=10.0",
]
# Ultron, the general local language model, is a separate optional extra. It runs
# a GGUF model locally through llama-cpp-python (nothing leaves the machine); the
# weights are a separate one-time, human-approved download. Never required by the
# base install, and imported lazily.
ultron = [
    "llama-cpp-python>=0.3",
    "huggingface_hub>=0.23",
]
# The Code Studio's in-process coding model is a separate optional extra, so the
# Studio can write code with no Ollama server left running in the background.
# Same runtime as Ultron (llama-cpp-python, CPU by default); the weights are a
# separate one-time, human-approved download. Never required by the base install.
coder = [
    "llama-cpp-python>=0.3",
    "huggingface_hub>=0.23",
]
# Vision, the petroleum-engineering local model, is a separate optional extra. It
# runs the OGAI Reasoner GGUF locally through llama-cpp-python (nothing leaves the
# machine); the weights are a separate one-time, human-approved download. Same
# runtime as Ultron, so a machine that already has `[ultron]` needs nothing new.
vision = [
    "llama-cpp-python>=0.3",
    "huggingface_hub>=0.23",
]
# The Presentation Studio PowerPoint export engine is a separate optional extra.
# `python-pptx` draws a real, editable deck (shapes, tables, embedded images,
# charts, speaker notes, RTL); the base install keeps the dependency-free
# standard-library writer as a fallback, and `core.pptx_engine` imports this
# package lazily. It is never required by the base install.
pptx = ["python-pptx>=1.0"]
# The Presentation Studio's own authoring model is a separate optional extra: a
# local Qwen3 GGUF (8B by default) loaded in-process through llama-cpp-python, so
# the Studio drafts structured outlines and slide bullets with no Ollama server
# left running. Same runtime as Ultron/the Code Studio; the weights are a separate
# one-time, human-approved download (`python -m cli presentation model-download
# --approve`). Never required by the base install -- the Studio falls back to the
# project's own assistant for drafting -- and the imports are lazy.
presentation = [
    "llama-cpp-python>=0.3",
    "huggingface_hub>=0.23",
]
# Banner, the Presentation Studio's local model, is the same Qwen3 GGUF promoted
# to a first-class mouth (see `core/banner.py`). It shares the `[presentation]`
# runtime and its `data/presentation` model folder, so a machine that already has
# `[presentation]` needs nothing new; the extra is named for symmetry with
# `[ultron]`/`[vision]` and because a user may install Banner alone.
banner = [
    "llama-cpp-python>=0.3",
    "huggingface_hub>=0.23",
]
# Natasha, the project's companion, runs her model in-process by default: a GGUF
# file loaded through llama-cpp-python, so no Ollama server has to be left
# running. Same runtime as Ultron/the Code Studio; the weights are a separate
# one-time, human-approved download (`python -m cli natasha download --approve`).
# Never required by the base install -- without it Natasha still runs against an
# existing Ollama server -- and the imports are lazy.
natasha = [
    "llama-cpp-python>=0.3",
    "huggingface_hub>=0.23",
]
# Hakeem, the project's scholar of religion and history, speaks through the *same*
# model as the companion (`hakeem/model.py` reuses `companion.model`), so this
# extra pins the same runtime and the same `data/natasha` model folder -- a
# machine that already has `[natasha]` needs nothing new. It is named for symmetry
# with the other mouth extras and because a user may install the scholar alone.
hakeem = [
    "llama-cpp-python>=0.3",
    "huggingface_hub>=0.23",
]
# The Qwen3 speech models are two *separate* optional extras, because they cannot
# share one environment: `qwen-asr` pins `transformers==4.57.6` while `qwen-tts`
# pins `transformers==4.57.3`, so installing both leaves pip no common
# `transformers` and it backtracks to an old release that caps `numpy<2.0` --
# which then has to be *built* from source (failing on Windows with a long-path
# error). Each extra therefore pins only its own package and lets that package
# own its `transformers` version. Pick one: `qwen-asr` for the microphone
# (52 languages, including Arabic) or `qwen-tts` for speech synthesis (ten
# languages, no Arabic). The weights are a separate one-time, human-approved
# download. Never required by the base install, and imported lazily.
qwen-asr = [
    "torch>=2.2",
    "qwen-asr",
    "huggingface_hub>=0.23",
]
qwen-tts = [
    "torch>=2.2",
    "qwen-tts",
    "huggingface_hub>=0.23",
]
# Piper is a separate optional extra: a real, local neural text-to-speech engine
# (VITS/ONNX) that sounds like a person rather than the robotic formant synthesis
# of espeak-ng, and -- unlike Qwen3-TTS -- **speaks Arabic**. It runs entirely on
# this machine, on the CPU, with nothing sent off it. Each voice is a separate
# ONNX model (a one-time, human-approved download into `data/piper`, fetched with
# huggingface_hub); the base install needs none of this, and the import is lazy.
piper = [
    "piper-tts>=1.2",
    "huggingface_hub>=0.23",
]

# Doc's Studio is a separate optional extra: its own local vision-language model
# (Qwen3-VL) loaded in-process through llama-cpp-python, so it can read any
# document -- including scanned PDFs and images -- with no server and nothing sent
# off the machine. pypdfium2/Pillow rasterise a scanned page to an image for the
# model (the same packages the [ocr] extra uses). The weights are a separate
# one-time, human-approved download. Never required by the base install, and the
# imports are lazy.
docs = [
    "llama-cpp-python>=0.3",
    "huggingface_hub>=0.23",
    "pypdfium2>=4.0",
    "Pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-config --strict-markers --basetemp=.pytest-tmp"
markers = [
    "integration: verifies contracts between cognitive layers",
    "end_to_end: verifies a complete cognitive loop",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["core", "storage", "tests", "ai", "evaluation", "ml", "cli", "gui", "scripts", "ingest"]

[tool.ruff.lint]
# Correctness (`F`), a broad slice of `pycodestyle`/`pyflakes` errors (`E`),
# real bugs (`B`), simplifications (`C4`), import order (`I`), modern syntax
# (`UP`), and Ruff's own rules (`RUF`). The set is deliberately wide: every
# category below is at zero violations, so the gate blocks a *new* mistake
# instead of only the original `F` set.
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "C4", "RUF"]

ignore = [
    # A 100-column line is the project's convention; enforcing it would rewrap
    # hundreds of already-clear lines for no correctness gain.
    "E501",
    # `str` + `enum.Enum` is a real "string enum" here: the members are stored,
    # compared, and printed as their values in the JSON store and every CLI
    # output, so `str(member)` must keep returning the value (e.g. "reservoir").
    # `StrEnum` changes `str()`/f-string output to the member's *name*, which
    # would silently alter persisted data and command matching. Not applied.
    "UP042",
    # Arabic and typographic punctuation (en/em dashes, Arabic comma, ×, °) are
    # intentional in this bilingual project, so a "confusable ASCII" warning is
    # noise rather than a defect.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert a deliberately blind exception (e.g. "any failure is fine
# here") and may use a short throwaway name; the source keeps the strict rules.
"tests/**" = ["B017", "B011", "E741"]

[tool.mypy]
python_version = "3.12"
files = ["core", "storage", "ai", "evaluation", "ml", "cli", "gui", "scripts", "tests", "ingest", "main.py"]
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true

# PyInstaller is a build-time tool without published type stubs.
[[tool.mypy.overrides]]
module = ["PyInstaller"]
ignore_missing_imports = true

# PDF reads are optional (``pip install .[pdf]``), so the import is guarded and
# may be absent; it must not fail a type check on a base install.
[[tool.mypy.overrides]]
module = ["pypdf"]
ignore_missing_imports = true

# OCR is an optional extra (``pip install .[ocr]``); its imports are lazy too.
# ``PIL`` is Pillow's import name.
[[tool.mypy.overrides]]
module = ["pypdfium2", "pytesseract", "PIL"]
ignore_missing_imports = true

# The learned text-to-image backend is an optional extra
# (``pip install .[image]``); it imports torch/diffusers lazily, so a base
# install must still type-check. torch ships its own stubs; diffusers has none.
[[tool.mypy.overrides]]
module = ["diffusers"]
ignore_missing_imports = true

# Ultron is an optional extra (``pip install .[ultron]``); it imports
# llama-cpp-python and huggingface_hub lazily, so a base install must still
# type-check.
[[tool.mypy.overrides]]
module = ["llama_cpp", "huggingface_hub"]
ignore_missing_imports = true

# The Presentation Studio PowerPoint engine is an optional extra
# (``pip install .[pptx]``); ``core.pptx_engine`` imports ``pptx`` lazily and a
# base install must still type-check. python-pptx ships no type stubs.
[[tool.mypy.overrides]]
module = ["pptx", "pptx.*"]
ignore_missing_imports = true

# The Qwen3 speech models are optional extras (``pip install .[qwen-asr]`` or
# ``.[qwen-tts]``);
# ``core.qwen_speech`` imports torch/qwen-asr/qwen-tts lazily, so a base install
# must still type-check. The Qwen packages ship no type stubs.
[[tool.mypy.overrides]]
module = ["torch", "qwen_asr", "qwen_tts"]
ignore_missing_imports = true

# Piper is an optional extra (``pip install .[piper]``); ``core.piper_speech``
# imports ``piper.voice``/``piper.config`` lazily, so a base install must still
# type-check. Piper ships no type stubs. The glob covers the submodules that are
# actually imported; a bare "piper" entry would be redundant (mypy matches a
# dotted module against the pattern, not its top-level parent).
[[tool.mypy.overrides]]
module = ["piper.*"]
ignore_missing_imports = true
